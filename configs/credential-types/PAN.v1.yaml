credential_type: PAN
version: 1
issuer: INCOME_TAX_DEPT
provider:
  name: digio
  endpoint: /v3/client/kyc/fetch_id_data/PAN
normalization:
  trim: true
  uppercase: true
validation:
  patterns:
    - "^[A-Z]{5}[0-9]{4}[A-Z]$"
  required_fields:
    - name
    - dob
request:
  fields:
    id_no: normalized_id
    name: name
    dob: dob
response:
  success_field: pan
  fields:
    pan: pan
    category: category
    status: status
    full_name: full_name
