credential_type: PAN
version: 1
issuer: INCOME_TAX_DEPT
provider:
  name: digio
  capability: fetch_id_data_pan
normalization:
  trim: true
  uppercase: true
validation:
  fields:
    id_no:
      required: true
      patterns:
        - "^[A-Z]{5}[0-9]{4}[A-Z]$"
      message: "invalid PAN format"
request:
  fields:
    id_no: normalized_id
response:
  success_field: pan
  fields:
    pan: pan
    category: category
    status: status
    full_name: full_name
