credential_type: FSSAI
version: 1
issuer: FSSAI_AUTHORITY
provider:
  name: digio
  endpoint: /client/v4/apis/kyc/fetch_id_data/FSSAI
normalization:
  trim: true
  remove_chars: " "
validation:
  patterns:
    - "^\\d{14}$"
request:
  fields:
    id_no: normalized_id
response:
  transformer: fssai_parse
