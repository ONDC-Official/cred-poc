credential_type: UDYAM
version: 1
issuer: MSME
provider:
  name: digio
  endpoint: /client/v4/apis/kyc/fetch_id_data/UDYAMAADHAAR
normalization:
  trim: true
  uppercase: true
validation:
  patterns:
    - "^UDYAM-[A-Z]{2}-\\d{2}-\\d{7}$"
    - "^UDYAM[A-Z]{2}\\d{2}\\d{7}$"
request:
  transformer: udyam_canonicalize
response:
  transformer: udyam_parse
