credential_type: UDYAM
version: 1
issuer: MSME
provider:
  name: digio
  endpoint: /client/v4/apis/kyc/fetch_id_data/UDYAMAADHAAR
normalization:
  trim: true
  uppercase: true
validation:
  fields:
    id_no:
      required: true
      patterns:
        - "^UDYAM-[A-Z]{2}-\\d{2}-\\d{7}$"
        - "^UDYAM[A-Z]{2}\\d{2}\\d{7}$"
      message: "invalid Udyam format, expected UDYAM-XX-00-0000000"
request:
  transformer: udyam_canonicalize
response:
  transformer: udyam_parse
