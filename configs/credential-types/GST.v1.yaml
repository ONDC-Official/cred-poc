credential_type: GST
version: 1
issuer: GSTN
provider:
  name: digio
  endpoint: /v3/client/kyc/fetch_id_data/GST
normalization:
  trim: true
  uppercase: true
validation:
  patterns:
    - "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$"
request:
  fields:
    id_no: normalized_id
response:
  transformer: gst_parse
