name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # APP_ID identifies the GitHub App; APP_PRIVATE_KEY authenticates it to
      # obtain a short-lived token scoped to the automation-iac repository.
      - name: Create automation-iac GitHub App token
        id: automation_iac_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: automation-iac

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=staging-1.0.0-{{sha}}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Checkout automation-iac
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/automation-iac
          token: ${{ steps.automation_iac_token.outputs.token }}
          path: automation-iac

      - name: Update cred-poc image tag in automation-iac
        run: |
          cd automation-iac
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          NEW_TAG="staging-1.0.0-${SHORT_SHA}"
          python3 -c "
          import re
          path = 'k8/aws/helm/service-layer/values-staging.yaml'
          with open(path, 'r') as f:
              content = f.read()
          new_content = re.sub(
              r'(credPoc:\s*\n\s*enabled:[^\n]*\n\s*image:\s*\n\s*repository:[^\n]*\n\s*tag:\s*)staging-1\.0\.0-[a-f0-9]+',
              r'\g<1>staging-1.0.0-${SHORT_SHA}',
              content,
          )
          with open(path, 'w') as f:
              f.write(new_content)
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8/aws/helm/service-layer/values-staging.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit (tag already up to date)."
          else
            git commit -m "ci(cred-poc): update image tag to ${NEW_TAG}"
            git push origin main
          fi

      - name: Send Google Chat Notification
        if: always()
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 -c '
          import os, sys, json, urllib.request, subprocess

          webhook_url = os.environ.get("GCHAT_WEBHOOK_URL", "").strip()
          if not webhook_url:
              print("GCHAT_WEBHOOK_URL is not set. Skipping notification.")
              sys.exit(0)

          status = os.environ.get("JOB_STATUS", "unknown").lower()
          branch = os.environ.get("REF_NAME", "")
          repo = os.environ.get("REPO", "")
          server_url = os.environ.get("SERVER_URL", "https://github.com")
          run_id = os.environ.get("RUN_ID", "")
          actor = os.environ.get("ACTOR", "")
          sha = os.environ.get("COMMIT_SHA", "")
          short_sha = sha[:7] if sha else ""
          workspace = os.environ.get("GITHUB_WORKSPACE", ".")

          # Fetch commit message and author from git log or event fallback
          try:
              commit_msg = subprocess.check_output(["git", "log", "-1", "--pretty=%s"], cwd=workspace).decode("utf-8").strip()
              commit_author = subprocess.check_output(["git", "log", "-1", "--pretty=%an"], cwd=workspace).decode("utf-8").strip()
          except Exception:
              fallback_msg = os.environ.get("HEAD_COMMIT_MSG", "").strip()
              commit_msg = fallback_msg.splitlines()[0] if fallback_msg else "N/A"
              commit_author = actor

          pipeline_url = f"{server_url}/{repo}/actions/runs/{run_id}"
          changes_url = f"{server_url}/{repo}/commit/{sha}"

          if status == "success":
              status_title = "✅ Pipeline Passed"
              status_badge = "<font color=\"#2EB886\"><b>PASSED</b></font>"
          elif status == "cancelled":
              status_title = "⚠️ Pipeline Cancelled"
              status_badge = "<font color=\"#FFA500\"><b>CANCELLED</b></font>"
          else:
              status_title = "❌ Pipeline Failed"
              status_badge = "<font color=\"#D9383A\"><b>FAILED</b></font>"

          author_display = f"{commit_author} (@{actor})" if commit_author and commit_author != actor else actor

          payload = {
              "cardsV2": [{
                  "cardId": "cred-poc-pipeline-alert",
                  "card": {
                      "header": {
                          "title": f"cred-poc: {status_title}",
                          "subtitle": f"Repository: {repo}"
                      },
                      "sections": [{
                          "widgets": [
                              {"decoratedText": {"topLabel": "Status", "text": status_badge}},
                              {"decoratedText": {"topLabel": "Branch", "text": f"<code>{branch}</code>"}},
                              {"decoratedText": {"topLabel": "Commit", "text": f"<code>{short_sha}</code> - {commit_msg}"}},
                              {"decoratedText": {"topLabel": "Author", "text": author_display}},
                              {
                                  "buttonList": {
                                      "buttons": [
                                          {"text": "View Pipeline", "onClick": {"openLink": {"url": pipeline_url}}},
                                          {"text": "View Changes", "onClick": {"openLink": {"url": changes_url}}}
                                      ]
                                  }
                              }
                          ]
                      }]
                  }
              }]
          }

          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(webhook_url, data=data, headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Google Chat notification sent: HTTP {resp.status}")
          except Exception as e:
              print(f"Failed to send Google Chat notification: {e}", file=sys.stderr)
          '
