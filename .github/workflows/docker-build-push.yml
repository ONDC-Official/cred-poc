name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # APP_ID identifies the GitHub App; APP_PRIVATE_KEY authenticates it to
      # obtain a short-lived token scoped to the automation-iac repository.
      - name: Create automation-iac GitHub App token
        id: automation_iac_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: automation-iac

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=staging-1.0.0-{{sha}}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Checkout automation-iac
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/automation-iac
          token: ${{ steps.automation_iac_token.outputs.token }}
          path: automation-iac

      - name: Update cred-poc image tag in automation-iac
        run: |
          cd automation-iac
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          NEW_TAG="staging-1.0.0-${SHORT_SHA}"
          echo "Updating cred-poc image tag to ${NEW_TAG} in values-staging.yaml..."
          sed -i -E "s/(tag: staging-1\.0\.0-)[a-f0-9]+/\1${SHORT_SHA}/" k8/aws/helm/service-layer/values-staging.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8/aws/helm/service-layer/values-staging.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit (tag already up to date)."
          else
            git commit -m "ci(cred-poc): update image tag to ${NEW_TAG}"
            git push origin main
          fi
