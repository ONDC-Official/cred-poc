name: Deploy to Server

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: choice
        options:
          - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Credential Service
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT || secrets.SERVER_PORT || 22 }}
          timeout: 30s
          command_timeout: 30m
          script: |
            set -e

            # Resolve deployment directory and settings (supports either GitHub Secret or Variable)
            DEPLOY_DIR="${{ vars.DEPLOY_DIR || secrets.DEPLOY_DIR }}"
            [ -z "$DEPLOY_DIR" ] && DEPLOY_DIR="$HOME/cred-poc"
            DEPLOY_DIR="${DEPLOY_DIR/#\~/$HOME}"

            BRANCH="${{ github.event.inputs.branch || 'main' }}"
            NETWORK_NAME="${{ vars.DOCKER_NETWORK_NAME || secrets.DOCKER_NETWORK_NAME || 'cred_network' }}"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            echo "=========================================================="
            echo " Deploying branch : $BRANCH"
            echo " Target directory : $DEPLOY_DIR"
            echo " Docker network   : $NETWORK_NAME"
            echo "=========================================================="

            # Detect Docker Compose command (Docker Compose V2 or V1)
            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "ERROR: Neither 'docker compose' nor 'docker-compose' found on server." >&2
              exit 1
            fi

            # Step 1: Clean up existing folder and stop running containers
            if [ -d "$DEPLOY_DIR" ]; then
              echo "Existing deployment found. Backing up .env and shutting down..."
              [ -f "$DEPLOY_DIR/.env" ] && cp "$DEPLOY_DIR/.env" /tmp/cred_poc.env
              (cd "$DEPLOY_DIR" && $COMPOSE down --remove-orphans) || true
              docker rm -f credential-service credential-service-postgres 2>/dev/null || true
              rm -rf "$DEPLOY_DIR"
            fi

            # Step 2: Clone fresh code
            echo "Cloning fresh code from branch '$BRANCH'..."
            mkdir -p "$(dirname "$DEPLOY_DIR")"
            git clone --depth 1 -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            git remote set-url origin "https://github.com/${{ github.repository }}.git" || true

            # Step 3: Configure environment (.env)
            if [ -f /tmp/cred_poc.env ]; then
              echo "Restoring backed-up .env file..."
              mv /tmp/cred_poc.env .env
            elif [ -f .env.sample ]; then
              echo "Initializing .env from .env.sample..."
              cp .env.sample .env
            fi

            # Step 4: Ensure manual Docker network exists
            echo "Verifying Docker network '$NETWORK_NAME'..."
            docker network inspect "$NETWORK_NAME" >/dev/null 2>&1 || docker network create "$NETWORK_NAME"

            # Step 5: Build and compose up
            echo "Building image and starting containers..."
            $COMPOSE up --build -d --remove-orphans

            # Step 6: Verify containers status
            echo "Verifying running services..."
            sleep 5
            $COMPOSE ps
            echo "Deployment completed successfully!"
