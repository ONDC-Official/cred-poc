services:
  credential-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credential-service
    ports:
      - "${CREDENTIAL_SERVICE_APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      CREDENTIAL_SERVICE_APP_NAME: "${CREDENTIAL_SERVICE_APP_NAME}"
      CREDENTIAL_SERVICE_APP_PORT: "8080"
      CREDENTIAL_SERVICE_APP_ENV: "${CREDENTIAL_SERVICE_APP_ENV}"
      CREDENTIAL_SERVICE_CREDENTIAL_TYPES_DIR: "configs/credential-types"
      CREDENTIAL_SERVICE_CREDENTIAL_PROVIDERS_DIR: "configs/providers"
      # When running inside Docker, `localhost` would point to the API container itself.
      # Use the Postgres service hostname instead.
      CREDENTIAL_SERVICE_DB_HOST: "postgres"
      # Inside the compose network Postgres is always on 5432. CREDENTIAL_SERVICE_DB_PORT
      # in .env is the *host* port, which may differ to avoid clashing with a local
      # Postgres install; it must not leak into the container.
      CREDENTIAL_SERVICE_DB_PORT: "5432"
      CREDENTIAL_SERVICE_DB_USER: "${CREDENTIAL_SERVICE_DB_USER}"
      CREDENTIAL_SERVICE_DB_PASSWORD: "${CREDENTIAL_SERVICE_DB_PASSWORD}"
      CREDENTIAL_SERVICE_DB_NAME: "${CREDENTIAL_SERVICE_DB_NAME}"
      CREDENTIAL_SERVICE_DB_SSL_MODE: "${CREDENTIAL_SERVICE_DB_SSL_MODE}"
      CREDENTIAL_SERVICE_DIGIO_BASE_URL: "${CREDENTIAL_SERVICE_DIGIO_BASE_URL}"
      CREDENTIAL_SERVICE_DIGIO_TOKEN: "${CREDENTIAL_SERVICE_DIGIO_TOKEN}"
      CREDENTIAL_SERVICE_DIGIO_TIMEOUT: "${CREDENTIAL_SERVICE_DIGIO_TIMEOUT}"
      CREDENTIAL_SERVICE_AUTH_ENABLED: "${CREDENTIAL_SERVICE_AUTH_ENABLED}"
      CREDENTIAL_SERVICE_AUTH_SUBSCRIBER_ID: "${CREDENTIAL_SERVICE_AUTH_SUBSCRIBER_ID}"
      CREDENTIAL_SERVICE_AUTH_UNIQUE_KEY_ID: "${CREDENTIAL_SERVICE_AUTH_UNIQUE_KEY_ID}"
      CREDENTIAL_SERVICE_AUTH_LOOKUP_URL: "${CREDENTIAL_SERVICE_AUTH_LOOKUP_URL}"
      CREDENTIAL_SERVICE_AUTH_SIGNING_PRIVATE: "${CREDENTIAL_SERVICE_AUTH_SIGNING_PRIVATE}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      cred_network:
        aliases:
          - credential-service

  postgres:
    image: postgres:16-alpine
    container_name: credential-service-postgres
    environment:
      POSTGRES_USER: ${CREDENTIAL_SERVICE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${CREDENTIAL_SERVICE_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${CREDENTIAL_SERVICE_DB_NAME:-credential_service}
    ports:
      - "${CREDENTIAL_SERVICE_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CREDENTIAL_SERVICE_DB_USER:-postgres} -d ${CREDENTIAL_SERVICE_DB_NAME:-credential_service}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      cred_network:
        aliases:
          - postgres

volumes:
  postgres_data:

networks:
  cred_network:
    name: ${DOCKER_NETWORK_NAME:-cred_network}
    external: true
